name: Release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege: the workflow default is read-only; only the publish job
# gets packages: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      TEST_POSTGRES_URL: postgres://verifier:verifier@localhost:5432/verifier?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verifier
          POSTGRES_PASSWORD: verifier
          POSTGRES_DB: verifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifier -d verifier"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go version

      - name: Build, vet, test
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # GHCR names must be lowercase; derive from the repository so forks
        # publish to their own namespace.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The Go build stage runs on the runner's platform and cross-compiles,
      # but the final alpine stage runs "apk add" / "adduser" on the target
      # platform, so the arm64 image needs arm64 emulation on this amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Put the OCI annotations on the multi-platform index as well.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          # v1.2.3 -> 1.2.3, 1.2, latest.
          # v1.2.3-rc.1 -> 1.2.3-rc.1 only (metadata-action emits {{version}}
          # for every pattern of a pre-release and sets no latest).
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Defaults already include org.opencontainers.image.source,
          # .revision and .version (plus created, title, url, licenses).

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builder/derp_admit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
