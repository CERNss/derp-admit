services:
  postgres:
    image: postgres:16
    container_name: verifier-postgres
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
      POSTGRES_DB: verifier
    ports:
      # Loopback only: the password is a fixed development value.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d verifier"]
      interval: 5s
      timeout: 3s
      retries: 10

  verifier:
    image: derp-admit:linux-amd64
    build:
      context: ../..
      dockerfile: builder/derp_admit/Dockerfile
    container_name: derp-verifier
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      CONFIG_FILE: "/app/config/config.yaml"
    ports:
      - "8080:8080"

  # derper built from the tailscale version pinned in go.mod (no usable
  # published image). Plain HTTP on :3340 for local smoke tests: TLS is only
  # served on :443 or with --certmode=manual; use one of those for real clients.
  derper:
    image: derp-admit-derper:v1.84.3
    build:
      context: .
      dockerfile: derper.Dockerfile
      args:
        TAILSCALE_VERSION: v1.84.3
    depends_on:
      - verifier
    command:
      - -a=:3340
      - -c=/var/lib/derper/derper.key
      - --verify-client-url=http://verifier:8080/verify/default
      - --verify-client-url-fail-open=false
    ports:
      - "3340:3340"
      - "3478:3478/udp"
    volumes:
      - derper-data:/var/lib/derper

volumes:
  postgres-data:
  derper-data:
