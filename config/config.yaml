addr: ":8080"
log_level: "info"

# Set to enable the authenticated /admin lifecycle API (>= 16 chars).
# Prefer the ADMIN_API_KEY env var over committing a secret here.
admin_api_key: ""
admin_rate_limit_rps: 10
admin_rate_limit_burst: 20

otel_enabled: false
otel_service_name: "derp-admit"
otel_exporter_otlp_endpoint: ""
otel_exporter_otlp_insecure: true
otel_trace_sample_ratio: 1.0

db_timeout: "2s"
verify_rate_limit_rps: 100
verify_rate_limit_burst: 200
register_rate_limit_rps: 5
register_rate_limit_burst: 10
verify_cache_ttl: "0s"
policy_sync_interval: "2s"
metrics_enabled: true

# Optional caller allowlists: comma-separated CIDRs or single IPs, matched on
# the TCP peer address only (forwarded headers are ignored), for example
# "10.0.0.0/8,192.0.2.7"; others get 403. Unset or empty means no restriction.
# verify_allowed_cidrs: ""
# metrics_allowed_cidrs: ""

# Audit retention in days (0 keeps rows forever); each instance prunes hourly.
# verify_audit_retention_days: 0
# admin_audit_retention_days: 0
