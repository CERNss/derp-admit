addr: ":8080"
log_level: "info"
enable_casbin: true

# Set to enable the authenticated /admin lifecycle API (>= 16 chars).
# Prefer the ADMIN_API_KEY env var over committing a secret here.
admin_api_key: ""
admin_rate_limit_rps: 10
admin_rate_limit_burst: 20

otel_enabled: false
otel_service_name: "derp-admit"
otel_exporter_otlp_endpoint: ""
otel_exporter_otlp_insecure: true
otel_trace_sample_ratio: 1.0

db_timeout: "2s"
verify_rate_limit_rps: 100
verify_rate_limit_burst: 200
register_rate_limit_rps: 5
register_rate_limit_burst: 10
verify_cache_ttl: "0s"
policy_sync_interval: "2s"
metrics_enabled: true
