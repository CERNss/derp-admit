# Production stack for derp-admit: PostgreSQL, the verifier, and one derper
# that asks the verifier about every client that connects to it.
#
#   cp deploy/.env.example deploy/.env    # then fill it in (see that file)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Step-by-step guide: docs/onboarding.md. Admin API reference: README.md.

name: derp-admit

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verifier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 32) in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-verifier}
    # No ports; only on the internal backend network, which derper does not join.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  verifier:
    image: ${VERIFIER_IMAGE:-ghcr.io/cernss/derp-admit:latest}
    # Lets "docker compose build" produce the image before any image is published.
    build:
      context: ..
      dockerfile: builder/derp_admit/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Plain string assembly: the password must be URL-safe (hex is).
      DATABASE_URL: postgres://${POSTGRES_USER:-verifier}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 32) in the env file}@postgres:5432/${POSTGRES_DB:-verifier}?sslmode=disable
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER (openssl rand -hex 32) in the env file}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY (openssl rand -hex 32) in the env file}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # derper only, as /32: host calls via the loopback port come from the front gateway, inside the subnet.
      VERIFY_ALLOWED_CIDRS: ${DERPER_IPV4:-10.203.117.10}/32
      # Container loopback + front gateway (= this host via the loopback port); add a remote Prometheus yourself.
      METRICS_ALLOWED_CIDRS: ${METRICS_ALLOWED_CIDRS:-127.0.0.1/32,${DERP_ADMIT_GATEWAY:-10.203.117.1}/32}
      # Days of audit rows to keep; 0 keeps them forever.
      VERIFY_AUDIT_RETENTION_DAYS: ${VERIFY_AUDIT_RETENTION_DAYS:-90}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-365}
    # Host loopback only (admin API, operator-run enrollment); never publish it publicly.
    ports:
      - "127.0.0.1:${VERIFIER_HOST_PORT:-8080}:8080"
    # front: derper and the published port; backend: postgres.
    networks: [front, backend]
    restart: unless-stopped
    healthcheck:
      # busybox wget is part of the Alpine base image; no package added.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  derper:
    image: ${DERPER_IMAGE:-derp-admit-derper:v1.84.3}
    # No usable published derper image; built at the version pinned in the Dockerfile.
    build:
      context: ../builder/derp_admit
      dockerfile: derper.Dockerfile
    depends_on:
      verifier:
        condition: service_healthy
    environment:
      # "true" logs every admitted and removed client (derp/derp_server.go).
      DERP_DEBUG_LOGS: ${DERP_DEBUG_LOGS:-false}
    command:
      # :443 inside the container, so derper serves TLS in both cert modes.
      - -a=:443
      # Plain HTTP: ACME http-01 challenges (letsencrypt), redirect, /generate_204.
      - --http-port=80
      - --stun-port=3478
      - --hostname=${DERP_HOSTNAME:?set DERP_HOSTNAME (the relay's DNS name) in the env file}
      - --certmode=${DERP_CERTMODE:-letsencrypt}
      # letsencrypt: cache in the writable volume; manual: the DERP_MANUAL_CERT_DIR mount.
      - --certdir=/var/lib/derper/${DERP_CERTMODE:-letsencrypt}-certs
      # Private node key; created on first start, kept in the volume.
      - -c=/var/lib/derper/derper.json
      - --verify-client-url=http://verifier:8080/verify/${DERP_RELAY:-default}
      # Refuse every client when the verifier cannot be reached.
      - --verify-client-url-fail-open=false
    ports:
      - "${DERP_HTTPS_PORT:-443}:443/tcp"
      - "${DERP_HTTP_PORT:-80}:80/tcp"
      - "${DERP_STUN_PORT:-3478}:3478/udp"
    volumes:
      - derper-data:/var/lib/derper
      # manual: absolute host dir with <DERP_HOSTNAME>.crt/.key; otherwise an unused empty volume.
      - ${DERP_MANUAL_CERT_DIR:-derper-manual-certs}:/var/lib/derper/manual-certs:ro
    # front only: "postgres" does not resolve here; blocking routed traffic between networks is the Docker host's job.
    networks:
      front:
        # Fixed so that VERIFY_ALLOWED_CIDRS can name exactly this container.
        ipv4_address: ${DERPER_IPV4:-10.203.117.10}
    restart: unless-stopped
    healthcheck:
      # Only shows the process is serving (port 80 answers 204); TLS is not checked.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/generate_204"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  # derper, verifier, published ports. Fixed subnet and gateway so both addresses are known.
  front:
    ipam:
      config:
        - subnet: ${DERP_ADMIT_SUBNET:-10.203.117.0/24}
          gateway: ${DERP_ADMIT_GATEWAY:-10.203.117.1}
  # verifier and postgres only; internal: no outside access. Its subnet is left to Docker (no allowlist names it).
  backend:
    internal: true

volumes:
  postgres-data:
  derper-data:
  derper-manual-certs:
